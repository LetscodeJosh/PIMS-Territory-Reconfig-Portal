# =============================================================================
# Google App Engine Configuration: PIMS Territory Reconfiguration Portal
# =============================================================================
runtime: python311
instance_class: F2

entrypoint: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false

automatic_scaling:
  min_instances: 1
  max_instances: 4
  target_cpu_utilization: 0.75

env_variables:
  STREAMLIT_SERVER_HEADLESS: "true"
  STREAMLIT_SERVER_ENABLE_CORS: "false"
  STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION: "false"
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
  ERPNEXT_URL: "https://staging.pmii-marketing.com"

handlers:
  - url: /.*
    script: auto
    secure: always

# =============================================================================
# Google Cloud Build Pipeline: PIMS Territory Reconfiguration Portal
# Continuous Deployment to Google Cloud Run
# =============================================================================
steps:
  # 1. Build the container image using Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pims-territory-portal:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pims-territory-portal:latest'
      - '.'

  # 2. Push container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/pims-territory-portal:$COMMIT_SHA'

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pims-territory-portal'
      - '--image'
      - 'gcr.io/$PROJECT_ID/pims-territory-portal:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1' # Singapore / Manila latency optimized
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'ERPNEXT_URL=https://staging.pmii-marketing.com'

images:
  - 'gcr.io/$PROJECT_ID/pims-territory-portal:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/pims-territory-portal:latest'

timeout: '900s'
options:
  logging: CLOUD_LOGGING_ONLY
